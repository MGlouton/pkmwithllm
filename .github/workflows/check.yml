name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the template wiki
        run: python3 vault/scripts/wiki_lint.py --strict
      - name: Run the session-start report
        run: python3 vault/scripts/session_start.py
      - name: No private folder in the template
        run: test -z "$(git ls-files vault/private)"
      - name: Agent-neutral core has no Claude Code settings
        run: test ! -e vault/.claude/settings.json
