name: Question or problem
description: Something is unclear, broken or does not work as described.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Please do not paste personal notes, names, tokens or anything from your private folder.
  - type: textarea
    id: what
    attributes:
      label: What happened, or what is unclear?
      description: Describe it in a few sentences. If a script failed, paste the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Agent and version, operating system, editor (for example "Claude Code 2.x on macOS, Obsidian 1.10").
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no personal or confidential data.
          required: true
